name: Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Archive dist folder
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "🚀 Iniciando Deploy..."
            
            mkdir -p ~/dev-ai-assistant
            cd ~/dev-ai-assistant
            
            git config --global --add safe.directory /home/azureuser/dev-ai-assistant
            
            echo "📥 Atualizando código..."
            git pull origin main
            
            echo "📦 Instalando dependências..."
            pnpm install
            
            echo "✅ Dependências instaladas."

      - name: Copy dist to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          source: "dist/*"
          target: "/home/azureuser/dev-ai-assistant/dist/"

      - name: Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 2m
          script: |
            echo "🔄 Reiniciando serviço..."
            pm2 delete dev-ai-assistant || true
            pm2 delete devai || true
            cd /home/azureuser/dev-ai-assistant
            pm2 start dist/server/_core/index.js --name dev-ai-assistant --update-env
            pm2 save
            echo "✅ Deploy finalizado!"
