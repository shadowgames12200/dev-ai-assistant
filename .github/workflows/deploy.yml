name: Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Iniciando Deploy..."
            
            # 1. Gerenciar Swap para evitar erro de memória (OOM)
            if [ ! -f /swapfile ]; then
              echo "⚙️ Criando arquivo de Swap (2GB)..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            
            # Navega para o diretório
            cd ~/dev-ai-assistant || { echo "❌ Erro: Diretório não encontrado"; exit 1; }
            
            # Configura diretório seguro
            git config --global --add safe.directory /home/${{ secrets.VM_USERNAME }}/dev-ai-assistant
            
            # Pull
            echo "📥 Atualizando código..."
            git pull origin main || { echo "❌ Erro no git pull"; exit 1; }
            
            # Dependências
            echo "📦 Instalando dependências..."
            pnpm install || { echo "❌ Erro no pnpm install"; exit 1; }
            
            # Build (Otimizado para baixa memória)
            echo "🏗️ Gerando build..."
            export NODE_OPTIONS=--max-old-space-size=1024
            # Limpa cache do vite para economizar espaço/memória
            rm -rf node_modules/.vite
            pnpm run build || { echo "❌ Erro no build"; exit 1; }
            
            # Reiniciar com PM2 (Forçado para garantir atualização)
            echo "🔄 Reiniciando serviço com PM2..."
            # Limpa o cache do PM2 e força a reinicialização total
            pm2 delete dev-ai-assistant || true
            pm2 start dist/server/_core/index.js --name dev-ai-assistant --update-env
            pm2 save # Salva o estado atual do PM2 para persistência
            
            echo "✅ Deploy finalizado com sucesso!"
