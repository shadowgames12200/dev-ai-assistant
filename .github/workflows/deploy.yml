name: Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 20m
          script: |
            echo "🚀 Iniciando Deploy..."
            
            mkdir -p ~/dev-ai-assistant
            cd ~/dev-ai-assistant
            
            if [ ! -f /swapfile ]; then
              echo "⚙️ Criando Swap (2GB)..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi
            
            git config --global --add safe.directory /home/azureuser/dev-ai-assistant
            
            echo "📥 Atualizando código..."
            git pull origin main
            
            echo "📦 Instalando dependências..."
            pnpm install
            
            echo "🏗️ Gerando build..."
            export NODE_OPTIONS=--max-old-space-size=1024
            rm -rf node_modules/.vite
            pnpm run build
            
            echo "🔄 Reiniciando serviço com PM2..."
            pm2 delete dev-ai-assistant || true
            pm2 delete devai || true
            pm2 start dist/server/_core/index.js --name dev-ai-assistant --update-env
            pm2 save
            
            echo "✅ Deploy finalizado com sucesso!"

