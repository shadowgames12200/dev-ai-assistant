name: Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            export HOME=/home/${{ secrets.VM_USERNAME }}
            echo "=== Iniciando Deploy do DevAI Assistant ==="
            
            cd ~/dev-ai-assistant
            git config --global --add safe.directory /home/${{ secrets.VM_USERNAME }}/dev-ai-assistant
            
            # Pull latest changes
            echo "📥 Baixando novas alterações..."
            git pull origin main
            
            # Install dependencies
            echo "📦 Instalando dependências..."
            pnpm install
            
            # Build with memory limit (importante para VM pequena)
            echo "🏗️ Gerando build..."
            export NODE_OPTIONS=--max-old-space-size=1536
            pnpm run build
            
            # Reiniciar o serviço
            echo "🚀 Reiniciando o serviço..."
            # Tenta parar o processo antigo se existir
            pkill -f "server/_core/index.ts" || true
            # Inicia em background
            nohup pnpm start > ia.log 2>&1 &
            
            echo "=== Deploy Concluído com Sucesso! ==="
