name: Auto Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Copy built files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          source: "dist/*"
          target: "/home/azureuser/dev-ai-assistant/dist/"
          strip_components: 0

      - name: Update code and restart on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo "🚀 Iniciando Deploy..."
            
            cd /home/azureuser/dev-ai-assistant
            
            git config --global --add safe.directory /home/azureuser/dev-ai-assistant
            
            echo "📥 Atualizando código..."
            git pull origin main
            
            echo "📦 Instalando dependências do backend..."
            pnpm install
            
            echo "🔄 Reiniciando serviço com PM2..."
            pm2 restart dev-ai-assistant || pm2 delete dev-ai-assistant || true
            pm2 delete devai || true
            pm2 start dist/server/_core/index.js --name dev-ai-assistant --update-env
            pm2 save
            
            echo "✅ Deploy finalizado com sucesso!"
