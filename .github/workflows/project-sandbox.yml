name: Project Sandbox Executor

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Identificador da tarefa"
        required: true
        type: string
      source_url:
        description: "URL HTTPS autorizada de repositório ou artefato"
        required: true
        type: string
      source_kind:
        description: "repository, archive, file ou document"
        required: true
        type: string
      task:
        description: "Objetivo técnico da tarefa"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  execute-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare isolated workspace
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_KIND: ${{ inputs.source_kind }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project-input" "$RUNNER_TEMP/project-output"
          case "$SOURCE_KIND" in
            repository)
              case "$SOURCE_URL" in
                https://github.com/*|https://www.github.com/*|https://gitlab.com/*|https://www.gitlab.com/*) git clone --depth 1 "$SOURCE_URL" "$RUNNER_TEMP/project-input/repository" ;;
                *) echo "Origem de repositório não autorizada" >&2; exit 1 ;;
              esac
              ;;
            archive|file|document)
              curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 "$SOURCE_URL" --output "$RUNNER_TEMP/project-input/source.bin"
              ;;
            *) echo "Tipo de origem inválido" >&2; exit 1 ;;
          esac

      - name: Run disposable Docker container
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus=2 \
            --memory=4g \
            --pids-limit=256 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env TASK="$TASK" \
            --workdir=/workspace \
            --volume "$RUNNER_TEMP/project-input:/workspace/input:ro" \
            --volume "$RUNNER_TEMP/project-output:/workspace/output:rw" \
            ubuntu:24.04 \
            bash -lc 'set -e; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git file unzip; { echo "Task: $TASK"; echo "Input: /workspace/input"; echo "Container execution completed."; } > /workspace/output/report.txt' \
            2>&1 | tee "$RUNNER_TEMP/project-output/execution.log"

      - name: Upload evidence and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-sandbox-${{ inputs.job_id }}
          path: |
            ${{ runner.temp }}/project-output/report.txt
            ${{ runner.temp }}/project-output/execution.log
          if-no-files-found: warn
          retention-days: 1
